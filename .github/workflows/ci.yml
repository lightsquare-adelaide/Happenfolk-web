name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. Real values live in Vercel project settings.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  invariants:
    name: DB invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset database
        run: supabase db reset

      - name: Export local stack environment for DB suites
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, writeFileSync } from 'node:fs';
          const raw = execFileSync('supabase', ['status', '-o', 'env'], { encoding: 'utf8' });
          const kv = Object.fromEntries([...raw.matchAll(/^([A-Z_]+)=(.*)$/gm)].map((m) => [m[1], m[2].replace(/^['"]|['"]$/g, '')]));
          const values = {
            NEXT_PUBLIC_SUPABASE_URL: kv.API_URL,
            NEXT_PUBLIC_SUPABASE_ANON_KEY: kv.ANON_KEY,
            SUPABASE_SERVICE_ROLE_KEY: kv.SERVICE_ROLE_KEY,
            SUPABASE_DB_URL: kv.DB_URL,
            NEXT_PUBLIC_SITE_URL: 'http://127.0.0.1:3105',
            TEST_APP_PORT: '3105',
          };
          for (const key of ['ANON_KEY', 'SERVICE_ROLE_KEY']) console.log(`::add-mask::${kv[key]}`);
          const content = Object.entries(values).map(([k, v]) => `${k}=${v}`).join('\n') + '\n';
          appendFileSync(process.env.GITHUB_ENV, content);
          writeFileSync('.env.local', content);
          NODE

      - name: Seed generated sample media
        run: npm run seed:media

      - name: Check invariants
        run: npm run check:invariants

      - name: Access-rule tests (RLS + storage, per-user clients)
        run: npm run test:access

      - name: Build app against the local stack (real URLs for middleware)
        run: |
          status="$(supabase status -o env)"
          # status -o env shell-quotes its values; strip the quotes or the
          # zod env check rejects the URL at build time.
          export NEXT_PUBLIC_SUPABASE_URL="$(printf '%s\n' "$status" | grep '^API_URL=' | cut -d= -f2- | tr -d "'\"")"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(printf '%s\n' "$status" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d "'\"")"
          export NEXT_PUBLIC_SITE_URL="http://127.0.0.1:3105"
          npm run build
        shell: bash

      - name: Auth-flow tests (middleware + sessions, real Next server)
        run: npm run test:auth

      - name: Install synthesized-media fixture tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # The runner's Azure mirror stalled while downloading fixture tools.
          # Keep signed Ubuntu packages, using the official HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          sudo timeout --kill-after=15s 120s apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout --kill-after=15s 240s env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends ffmpeg libimage-exiftool-perl
          ffmpeg -version
          exiftool -ver

      - name: Media and profile integration (real storage and Next server)
        run: npm run test:media

      - name: Events rules and API integration (real stack and Next server)
        run: npm run test:events

      - name: Portfolio ordering and metadata integration (real stack)
        run: npm run test:portfolio

      - name: Discovery ranking and search integration (real stack)
        run: npm run test:discovery

      - name: Launch integration (seeded DB, production server, live HTTP journey)
        run: npm run test:integration

      - name: Compliance (retention, public disclosures, moderation, accessibility)
        run: npm run test:compliance

      - name: Stop local stack
        if: always()
        run: supabase stop

  database:
    name: Migrations lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for migrations
        id: check
        run: |
          if [ -n "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No migrations yet - skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.check.outputs.present == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.present == 'true'
        with:
          version: 2.116.0

      - name: Start local Supabase
        if: steps.check.outputs.present == 'true'
        run: supabase start

      - name: Lint migrations
        if: steps.check.outputs.present == 'true'
        run: supabase db lint --level warning

      # Excluded from `npm test` because they need this running stack.
      - name: Payment-path tests
        if: steps.check.outputs.present == 'true'
        run: npm run test:payments
